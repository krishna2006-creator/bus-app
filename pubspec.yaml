name: agni_college_bus_tracker
description: "Track your campus commute with ease! This modern mobile UI for Agni College's Bus Tracking System offers real-time bus locations, personalized dashboards for students, staff, and drivers, and robust admin controls, all wrapped in a sleek design with college"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  google_maps_flutter: ^2.10.0
  flutter_map: ^6.0.1
  latlong2: ^0.9.0
  geolocator: 13.0.4
  url_launcher: ^6.0.0
  file_picker: ^8.0.0
  path_provider: ^2.0.0
  open_file: ^3.0.0
  http: ^1.0.0
  flutter_pdfview: ^1.3.2
  photo_view: ^0.14.0
  web_socket_channel: ^3.0.3
  permission_handler: ^12.0.1
  
  # Firebase packages
  firebase_core: ^3.3.0
  firebase_database: ^11.0.0
  firebase_auth: ^5.1.2
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  flutter_app_badger: ^1.5.0
  
  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/ag logo.png
  remove_alpha_ios: true
