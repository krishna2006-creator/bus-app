version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-busapp}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2026-01-01T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./bus_tracking_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-busapp}"
      REDIS_URL: "redis://redis:6379/0"
      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      FIREBASE_CREDENTIALS_PATH: /app/serviceAccountKey.json
    ports:
      - "8000:8000"
    volumes:
      - ./bus_tracking_backend:/app
      - ./bus_tracking_backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro

volumes:
  db_data:
  minio_data:
